<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>echo · 歌词呈现探索 / lyric presentation</title>
<style>
  :root { --ui: rgba(255,255,255,0.85); --dim: rgba(255,255,255,0.5); --accent: #8a7bff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #06060a; color: var(--ui);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans", system-ui, sans-serif; }
  /* understated background — text is the hero */
  #bg { position: fixed; inset: 0; z-index: 0; transition: background 1s;
    background:
      radial-gradient(ellipse 90% 70% at 50% 35%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(ellipse 70% 60% at 70% 85%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
      #06060a; }
  #stage { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
  #lyricRoot { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* ───── shared line atoms ───── */
  .w { display: inline-block; white-space: pre; }

  /* ===== Apple Music / Focus (scrolling list) ===== */
  .al-wrap { position: absolute; left: 8%; right: 8%; will-change: transform;
    transition: transform .65s cubic-bezier(.22,.61,.18,1); }
  .al-line { font-size: 32px; font-weight: 700; line-height: 1.32; padding: 11px 0;
    color: rgba(255,255,255,0.30); transform-origin: left center;
    transition: opacity .5s, filter .5s, transform .5s, color .45s; }
  .al-line .w { color: inherit; transition: color .28s, text-shadow .28s, opacity .28s; }
  .al-line.active { color: rgba(255,255,255,0.4); }
  .al-line.active .w.sung { color: #fff; text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 70%, #fff); }

  /* ===== Karaoke (per-char wipe fill) ===== */
  .kk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 8%; }
  .kk-line { position: relative; font-size: 46px; font-weight: 800; letter-spacing: .5px; text-align: center; line-height: 1.25; }
  .kk-base { color: rgba(255,255,255,0.26); }
  .kk-fill { position: absolute; inset: 0; color: #fff; white-space: pre-wrap; overflow: hidden;
    text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 80%, #fff);
    -webkit-background-clip: text; }

  /* ===== Spotlight (single huge line, crossfade) ===== */
  .sp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 8%; }
  .sp-line { position: absolute; text-align: center; font-size: 50px; font-weight: 800; line-height: 1.2;
    letter-spacing: .5px; opacity: 0; transform: translateY(24px) scale(.96); filter: blur(6px);
    transition: opacity .6s, transform .7s cubic-bezier(.2,.7,.2,1), filter .6s;
    text-shadow: 0 4px 40px rgba(0,0,0,.5); }
  .sp-line.in { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  .sp-line.out { opacity: 0; transform: translateY(-24px) scale(1.03); filter: blur(6px); }

  /* ===== Kinetic (per-char staggered entrance) ===== */
  .kn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 8%; }
  .kn-line { text-align: center; font-size: 48px; font-weight: 800; line-height: 1.2; }
  .kn-line .c { display: inline-block; white-space: pre; opacity: 0; transform: translateY(40px) rotateX(-60deg); filter: blur(8px);
    animation: knIn .7s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes knIn { to { opacity:1; transform: translateY(0) rotateX(0); filter: blur(0); } }

  /* ===== Vertical (CJK 竖排) ===== */
  .vt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .vt-wrap { display: flex; flex-direction: row-reverse; gap: 26px; will-change: transform;
    transition: transform .65s cubic-bezier(.22,.61,.18,1); }
  .vt-line { writing-mode: vertical-rl; font-size: 30px; font-weight: 700; letter-spacing: 4px;
    color: rgba(255,255,255,0.28); transition: color .4s, opacity .5s, filter .5s; max-height: 78vh; }
  .vt-line.active { color: #fff; }
  .vt-line.active .w.sung { color:#fff; text-shadow: 0 0 16px color-mix(in srgb,var(--accent) 70%,#fff); }
  .vt-line:not(.active) { opacity:.5; filter: blur(1px); }

  /* ───── controls ───── */
  #panel { position: fixed; top: 18px; left: 18px; width: 250px; z-index: 10;
    background: rgba(14,14,20,0.55); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
    transition: transform .3s, opacity .3s; }
  body.hide-ui #panel, body.hide-ui #transport, body.hide-ui #desc, body.hide-ui #hud { opacity: 0; pointer-events: none; }
  #panel h1 { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .styleBtn { appearance: none; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--ui);
    border-radius: 10px; padding: 8px 6px; font-size: 12px; cursor: pointer; text-align: left; line-height: 1.2; transition: all .15s; }
  .styleBtn:hover { background: rgba(255,255,255,0.1); }
  .styleBtn.active { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.5); }
  .styleBtn .en { display: block; font-size: 9px; color: var(--dim); margin-top: 2px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; }
  .row label { flex: 1; color: var(--dim); }
  input[type=color] { width: 30px; height: 24px; border: none; border-radius: 6px; background: none; cursor: pointer; }
  #transport { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 12px;
    background: rgba(14,14,20,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px; padding: 8px 16px; transition: opacity .3s; }
  #playBtn { appearance: none; border: none; background: #fff; color: #000; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 13px; }
  #bar { width: 320px; height: 5px; background: rgba(255,255,255,0.18); border-radius: 3px; cursor: pointer; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; border-radius: 3px; }
  #time { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 70px; }
  #desc { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 10; max-width: 560px; text-align: center;
    font-size: 12px; color: var(--dim); line-height: 1.6; transition: opacity .3s; }
  #desc b { color: var(--ui); }
  #hud { position: fixed; top: 18px; right: 18px; z-index: 10; font-size: 11px; color: var(--dim); text-align: right; line-height: 1.7; transition: opacity .3s; }
  kbd { background: rgba(255,255,255,0.12); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="stage"><div id="lyricRoot"></div></div>

  <div id="panel">
    <h1>歌词呈现探索</h1>
    <div class="grid" id="styleGrid"></div>
    <div class="row"><label>主色调</label><input type="color" id="accent" value="#8a7bff" /></div>
  </div>

  <div id="transport">
    <button id="playBtn">❚❚</button>
    <div id="bar"><div id="fill"></div></div>
    <div id="time">0:00 / 0:00</div>
  </div>

  <div id="hud"><div><kbd>space</kbd> 播放 · <kbd>← →</kbd> 主题 · <kbd>H</kbd> UI</div></div>
  <div id="desc"><b id="descTitle"></b> — <span id="descText"></span></div>

<script>
// ── a fake, word-timed song that loops, so motion/timing is visible ──
function L(t, end, text){ const ws=text.split(' '); const n=ws.length, step=(end-t)/n;
  return { t, end, text, cjk:false, words: ws.map((w,i)=>({ w:(i? ' '+w : w), t:t+i*step, end:t+(i+1)*step })) }; }
function CJK(t, end, text){ const cs=[...text]; const n=cs.length, step=(end-t)/n;
  return { t, end, text, cjk:true, words: cs.map((c,i)=>({ w:c, t:t+i*step, end:t+(i+1)*step })) }; }

const SONG = [
  L(1.0, 4.6,  "City lights blur into the rain"),
  L(5.0, 8.6,  "I trace your name on the window glass"),
  L(9.0, 12.6, "every heartbeat a fading train"),
  CJK(13.0, 16.6, "霓虹熄灭之前 再看你一眼"),
  L(17.0, 20.6, "hold the night a little longer"),
  L(21.0, 24.8, "before the morning takes you away"),
];
const LOOP = 27.0;

// ── transport ──
let playing=true, base=performance.now(), seek=0;
function nowT(){ const t = playing ? (performance.now()-base)/1000 + seek : seek; return ((t % LOOP) + LOOP) % LOOP; }
function setSeek(s){ seek = ((s % LOOP)+LOOP)%LOOP; base=performance.now(); }
function activeIndex(t){ let ai=-1; for(let i=0;i<SONG.length;i++) if(t>=SONG[i].t) ai=i; return ai; }
function wordProgress(line,t){ // 0..1 fraction of line "sung" by char count
  if(t>=line.end) return 1; if(t<line.t) return 0;
  let chars=0, total=0; line.words.forEach(w=>total+=w.w.length);
  for(const w of line.words){ if(t>=w.end){ chars+=w.w.length; }
    else if(t>=w.t){ chars += w.w.length * (t-w.t)/(w.end-w.t); break; } else break; }
  return chars/total; }

// ════════════════════════ renderers ═══════════════════════════════
const root=document.getElementById('lyricRoot');
let R=null; // current renderer
function clear(){ root.innerHTML=''; }

const RENDERERS = {
  apple: {
    cn:'Apple Music', en:'scroll · 逐词点亮', blurMax:4,
    desc:'垂直滚动，当前行清晰加粗、其余按距离渐隐＋模糊失焦；当前行内<b>逐词点亮</b>并发光，滚动用弹性缓动。流媒体黄金范式。',
    build(){ clear(); const wrap=document.createElement('div'); wrap.className='al-wrap'; this.wrap=wrap; this.els=[];
      SONG.forEach(line=>{ const el=document.createElement('div'); el.className='al-line'; el._words=[];
        line.words.forEach(wd=>{ const s=document.createElement('span'); s.className='w'; s.textContent=wd.w; el.appendChild(s); el._words.push(s); });
        wrap.appendChild(el); this.els.push(el); });
      root.appendChild(wrap); },
    update(t){ const ai=activeIndex(t), C=root.clientHeight/2, B=this.blurMax;
      this.els.forEach((el,i)=>{ const d=Math.abs(i-ai);
        if(i===ai){ el.classList.add('active'); el.style.opacity=1; el.style.filter='none'; el.style.transform='scale(1)';
          const L=SONG[i]; el._words.forEach((s,wi)=>s.classList.toggle('sung', t>=L.words[wi].t));
        } else { el.classList.remove('active'); el.style.opacity=Math.max(0.14,0.46-d*0.1);
          el.style.filter='blur('+Math.min(d*1.1,B)+'px)'; el.style.transform='scale(0.95)';
          el._words.forEach(s=>s.classList.remove('sung')); } });
      if(ai>=0){ const el=this.els[ai]; this.wrap.style.transform='translateY('+(C-(el.offsetTop+el.offsetHeight/2))+'px)'; }
      else this.wrap.style.transform='translateY('+(C-30)+'px)'; },
  },

  focus: {
    cn:'焦点景深', en:'cinematic DOF', blurMax:7,
    desc:'同样滚动，但失焦更狠、上下只透出两三行，当前行更大。像电影字幕的<b>景深虚化</b>，注意力全在此刻这一句。',
    build(){ RENDERERS.apple.build.call(this); this.wrap.style.left='12%'; this.wrap.style.right='12%';
      this.els.forEach(el=>el.style.fontSize='38px'); },
    update(t){ const ai=activeIndex(t), C=root.clientHeight/2;
      this.els.forEach((el,i)=>{ const d=Math.abs(i-ai);
        if(i===ai){ el.classList.add('active'); el.style.opacity=1; el.style.filter='none'; el.style.transform='scale(1.06)';
          const L=SONG[i]; el._words.forEach((s,wi)=>s.classList.toggle('sung', t>=L.words[wi].t));
        } else { el.classList.remove('active'); el.style.opacity=Math.max(0,0.4-d*0.16);
          el.style.filter='blur('+Math.min(2+d*2.2,9)+'px)'; el.style.transform='scale(0.9)';
          el._words.forEach(s=>s.classList.remove('sung')); } });
      if(ai>=0){ const el=this.els[ai]; this.wrap.style.transform='translateY('+(C-(el.offsetTop+el.offsetHeight/2))+'px)'; } },
  },

  karaoke: {
    cn:'卡拉OK', en:'per-char wipe', desc:'当前行居中放大，亮色从左到右<b>逐字填充</b>掠过整句（KTV 那种），填充边缘跟着词的节奏走。最有"跟着唱"的代入感。',
    build(){ clear(); const box=document.createElement('div'); box.className='kk';
      const line=document.createElement('div'); line.className='kk-line';
      this.base=document.createElement('div'); this.base.className='kk-base';
      this.fill=document.createElement('div'); this.fill.className='kk-fill';
      line.appendChild(this.base); line.appendChild(this.fill); box.appendChild(line); root.appendChild(box); this.idx=-2; },
    update(t){ const ai=activeIndex(t);
      if(ai!==this.idx){ this.idx=ai; const txt = ai>=0?SONG[ai].text:''; this.base.textContent=txt; this.fill.textContent=txt; }
      if(ai>=0){ const p=wordProgress(SONG[ai],t)*100; this.fill.style.clipPath='inset(0 '+(100-p)+'% 0 0)'; } },
  },

  spotlight: {
    cn:'聚光灯', en:'single · crossfade', desc:'只显示当前一句，巨大居中。换行时旧句上浮虚化淡出、新句下方<b>缩放浮入</b>。极简、专注、有呼吸感。',
    build(){ clear(); this.box=document.createElement('div'); this.box.className='sp'; root.appendChild(this.box); this.idx=-2; this.cur=null; },
    update(t){ const ai=activeIndex(t); if(ai===this.idx) return; this.idx=ai;
      const old=this.cur;
      if(old){ old.classList.remove('in'); old.classList.add('out'); setTimeout(()=>old.remove(),700); }
      if(ai>=0){ const el=document.createElement('div'); el.className='sp-line'; el.textContent=SONG[ai].text; this.box.appendChild(el);
        void el.offsetWidth; el.classList.add('in'); this.cur=el; } else this.cur=null; },
  },

  kinetic: {
    cn:'动态字', en:'kinetic type', desc:'MV 风格：换行时整句的每个字<b>错位翻入</b>（位移＋3D 旋转＋去模糊，逐字延迟）。运动本身就是表演。',
    build(){ clear(); this.box=document.createElement('div'); this.box.className='kn'; root.appendChild(this.box); this.idx=-2; },
    update(t){ const ai=activeIndex(t); if(ai===this.idx) return; this.idx=ai; this.box.innerHTML='';
      if(ai<0) return; const line=document.createElement('div'); line.className='kn-line';
      [...SONG[ai].text].forEach((ch,i)=>{ const s=document.createElement('span'); s.className='c'; s.textContent=ch;
        s.style.animationDelay=(i*0.035)+'s'; line.appendChild(s); }); this.box.appendChild(line); },
  },

  vertical: {
    cn:'竖排', en:'vertical · CJK', desc:'日系竖排：从右往左一列一列，当前列点亮逐字。配二次元/和风曲目，仪式感拉满（英文行会自动横向降级）。',
    build(){ clear(); const box=document.createElement('div'); box.className='vt';
      const wrap=document.createElement('div'); wrap.className='vt-wrap'; this.wrap=wrap; this.els=[];
      SONG.forEach(line=>{ const el=document.createElement('div'); el.className='vt-line'; el._words=[];
        if(!line.cjk) el.style.writingMode='horizontal-tb';
        line.words.forEach(wd=>{ const s=document.createElement('span'); s.className='w'; s.textContent=wd.w; el.appendChild(s); el._words.push(s); });
        wrap.appendChild(el); this.els.push(el); });
      box.appendChild(wrap); root.appendChild(box); },
    update(t){ const ai=activeIndex(t), C=root.clientWidth/2;
      this.els.forEach((el,i)=>{ if(i===ai){ el.classList.add('active'); const L=SONG[i];
          el._words.forEach((s,wi)=>s.classList.toggle('sung', t>=L.words[wi].t)); }
        else { el.classList.remove('active'); el._words.forEach(s=>s.classList.remove('sung')); } });
      if(ai>=0){ const el=this.els[ai]; this.wrap.style.transform='translateX('+(C-(el.offsetLeft+el.offsetWidth/2))+'px)'; } },
  },
};
const ORDER=['apple','focus','karaoke','spotlight','kinetic','vertical'];

// ════════════════════════ loop + UI ═══════════════════════════════
function fmt(s){ s=Math.max(0,s|0); return (s/60|0)+':'+String(s%60).padStart(2,'0'); }
function tick(){ requestAnimationFrame(tick); const t=nowT();
  if(R&&R.update) R.update(t);
  document.getElementById('fill').style.width=(t/LOOP*100)+'%';
  document.getElementById('time').textContent=fmt(t)+' / '+fmt(LOOP);
}
function setStyle(key){ R=RENDERERS[key]; R.build();
  [...document.querySelectorAll('.styleBtn')].forEach(b=>b.classList.toggle('active',b.dataset.k===key));
  document.getElementById('descTitle').textContent=`${R.cn} / ${R.en}`;
  document.getElementById('descText').innerHTML=R.desc; }

const grid=document.getElementById('styleGrid');
ORDER.forEach(k=>{ const r=RENDERERS[k]; const b=document.createElement('button'); b.className='styleBtn'; b.dataset.k=k;
  b.innerHTML=`${r.cn}<span class="en">${r.en}</span>`; b.onclick=()=>setStyle(k); grid.appendChild(b); });

const playBtn=document.getElementById('playBtn');
function setPlaying(p){ if(p){ base=performance.now(); playing=true; playBtn.textContent='❚❚'; } else { seek=nowT(); playing=false; playBtn.textContent='▶'; } }
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById('bar').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); setSeek((e.clientX-r.left)/r.width*LOOP); };
const accentEl=document.getElementById('accent');
accentEl.oninput=()=>document.documentElement.style.setProperty('--accent',accentEl.value);
document.documentElement.style.setProperty('--accent',accentEl.value);
addEventListener('keydown',e=>{ const i=ORDER.indexOf([...document.querySelectorAll('.styleBtn.active')][0]?.dataset.k);
  if(e.key===' '){ e.preventDefault(); setPlaying(!playing); }
  if(e.key==='ArrowRight') setStyle(ORDER[(i+1)%ORDER.length]);
  if(e.key==='ArrowLeft') setStyle(ORDER[(i-1+ORDER.length)%ORDER.length]);
  if(e.key.toLowerCase()==='h') document.body.classList.toggle('hide-ui'); });
addEventListener('resize',()=>{ if(R&&R.update) R.update(nowT()); });

setStyle('apple');
requestAnimationFrame(tick);
</script>
</body>
</html>
