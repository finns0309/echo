<!doctype html>
<!-- ticket-taste.html — 票根主题的静态口味校对,非实现。

     场景:散场后的桌角,台灯光池。三种材质同台:
       · 纸(门票/票根堆)——哑光,排版,撕票口,「散场」章
       · 镭射箔(防伪条)——彩虹衍射只住在一窄条里,歌词是防伪文字
       · 亚克力(封面立牌)——边缘导光,LED 发光底座,表面高光线
     纪律延续广告牌那页:饱和度配给制(彩虹只在镭射条内),
     瑕疵与光都要有物理出处,影子画扎实(静物成不成立全看影子)。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>票根 · taste check</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #070605;
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  --accent: #5fd4dc; /* 来自封面的青,正式实现时由专辑封面取色 */
}

/* ── 房间:墙 + 台灯光锥(灯在画外右上) ─────────────────── */
#wall {
  position: fixed; inset: 0;
  background:
    radial-gradient(30% 24% at 60% 2%, rgba(255, 212, 152, 0.14), transparent 70%),
    radial-gradient(82% 66% at 60% 12%, rgba(255, 186, 116, 0.20), transparent 62%),
    radial-gradient(120% 90% at 50% 110%, rgba(20, 14, 9, 0.8), transparent 70%),
    linear-gradient(200deg, #0d0a08, #070605 60%);
}
/* 桌面:横过下半屏,光池落在物件周围 */
#desk {
  position: fixed; left: 0; right: 0; bottom: 0; height: 42%;
  background:
    radial-gradient(64% 78% at 55% 14%, rgba(255, 178, 102, 0.26), transparent 72%),
    repeating-linear-gradient(177deg, rgba(255, 220, 180, 0.014) 0 2px, transparent 2px 12px),
    linear-gradient(180deg, #19120c, #0c0806 70%, #080505);
}
#desk::before { /* 桌沿:墙与桌的交线吃一点灯光 */
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent 18%, rgba(255, 196, 130, 0.20) 56%, transparent 88%);
}
#grain {
  position: fixed; inset: 0; opacity: 0.05; pointer-events: none;
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.6"/></svg>');
}

/* ── 静物组 ───────────────────────────────────────────────── */
#set {
  position: absolute; left: 50%; bottom: 5vh;
  width: 920px; height: 460px;
  transform: translateX(-50%);
}

/* 立牌:LED 底座 + 亚克力砖 + 封面 */
#base {
  position: absolute; left: 586px; bottom: 76px; width: 268px; height: 24px;
  border-radius: 5px;
  background: linear-gradient(180deg, #262b31, #15181c 70%, #0d0f12);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
}
#base i { /* LED 缝:底座顶面的发光槽,随 rms 呼吸 */
  position: absolute; left: 22px; right: 22px; top: 2px; height: 2px; border-radius: 2px;
  background: var(--accent);
  box-shadow: 0 0 8px 1px rgba(95, 212, 220, 0.55);
  animation: breathe 5.2s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: 0.55; box-shadow: 0 0 6px 1px rgba(95, 212, 220, 0.35); }
  50%      { opacity: 1;    box-shadow: 0 0 12px 2px rgba(95, 212, 220, 0.65); }
}
#baseShadow {
  position: absolute; left: 574px; bottom: 66px; width: 300px; height: 22px;
  background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, 0.55), transparent 70%);
  filter: blur(4px);
}
#spill { /* 底座的光在桌面上洇开一点点 */
  position: absolute; left: 594px; bottom: 58px; width: 250px; height: 26px;
  background: radial-gradient(50% 60% at 50% 40%, rgba(95, 212, 220, 0.10), transparent 70%);
  filter: blur(5px);
}

#acrylic {
  position: absolute; left: 610px; bottom: 96px; width: 220px; height: 252px;
  background: rgba(210, 235, 240, 0.028);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 3px;
  /* 底座的光从下棱导进来 */
  box-shadow:
    inset 0 -18px 26px -18px rgba(95, 212, 220, 0.50),
    inset 0 1px 0 rgba(255, 255, 255, 0.10);
}
#acrylic::before, #acrylic::after { /* 侧棱导光 */
  content: ""; position: absolute; top: 0; bottom: 0; width: 1.5px;
  background: linear-gradient(0deg, rgba(95, 212, 220, 0.5), rgba(95, 212, 220, 0.05) 62%, rgba(255, 255, 255, 0.07));
}
#acrylic::before { left: -0.5px; } #acrylic::after { right: -0.5px; }

#cover {
  position: absolute; left: 10px; top: 10px; width: 198px; height: 198px;
  border-radius: 2px; overflow: hidden; opacity: 0.96;
  /* 假封面:雾紫的夜 + 一轮月。正式实现换成网易云封面 */
  background:
    radial-gradient(circle at 69% 25%, #f6e7c4 0 10.5%, rgba(246, 231, 196, 0.16) 13%, transparent 16%),
    linear-gradient(0deg, rgba(8, 14, 24, 0.88) 0 20%, transparent 44%),
    linear-gradient(165deg, #463160 0%, #283659 46%, #14293c 100%);
}
#cover .t1 {
  position: absolute; left: 13px; bottom: 26px;
  font-size: 12px; letter-spacing: 5px; color: rgba(255, 255, 255, 0.78);
}
#cover .t2 {
  position: absolute; left: 13px; bottom: 12px;
  font-size: 7px; letter-spacing: 2.5px; color: rgba(255, 255, 255, 0.34);
}
#acrylicSpec { /* 亚克力面上的一道斜高光,晃动时它会平移 */
  position: absolute; left: 610px; bottom: 96px; width: 220px; height: 252px;
  border-radius: 3px; pointer-events: none;
  background: linear-gradient(104deg, transparent 42%, rgba(255, 255, 255, 0.06) 48%, rgba(255, 255, 255, 0.015) 54%, transparent 59%);
}

/* ── 当前这首歌的票:斜靠在底座上 ────────────────────────── */
#ticketShadow {
  position: absolute; left: 148px; bottom: 52px; width: 480px; height: 20px;
  background: radial-gradient(50% 50% at 46% 50%, rgba(0, 0, 0, 0.5), transparent 72%);
  filter: blur(5px);
  transform: rotate(-1.2deg);
}
#ticket {
  position: absolute; left: 150px; bottom: 60px; width: 474px; height: 172px;
  transform: rotate(-5deg); transform-origin: 30% 100%;
  display: flex;
  border-radius: 6px;
  background:
    repeating-linear-gradient(0deg, rgba(120, 90, 50, 0.022) 0 1px, transparent 1px 3px),
    linear-gradient(172deg, #f6f1e5, #efe8d8 58%, #e7ddc8);
  box-shadow:
    inset 0 0 0 0.5px rgba(120, 90, 40, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.75),
    0 3px 9px rgba(0, 0, 0, 0.35),
    0 16px 30px -10px rgba(0, 0, 0, 0.4);
  color: #2c2418;
}
#tMain { position: relative; flex: 1; padding: 15px 16px 13px 18px; }
.tag {
  font-size: 8px; letter-spacing: 2.5px; color: rgba(44, 36, 24, 0.52); font-weight: 600;
}
#tTitle { margin-top: 5px; font-size: 23px; font-weight: 800; letter-spacing: 1px; }
#tArtist { margin-top: 3px; font-size: 10px; letter-spacing: 1.5px; color: rgba(44, 36, 24, 0.62); }

/* 镭射防伪条:彩虹只允许住在这一条里,歌词是防伪文字 */
#holo {
  position: relative; margin-top: 11px; height: 36px; border-radius: 3px;
  display: flex; align-items: center; padding: 0 12px;
  /* 银箔为主,彩虹只在一条斜向的"受光带"里若隐若现 */
  background:
    linear-gradient(112deg, transparent 30%, rgba(255, 255, 255, 0.55) 42%, rgba(255, 255, 255, 0.06) 50%, transparent 58%),
    linear-gradient(112deg, rgba(206, 210, 215, 0.92) 0 28%, rgba(206, 210, 215, 0.30) 44%, rgba(206, 210, 215, 0) 56%, rgba(206, 210, 215, 0.55) 76%, rgba(206, 210, 215, 0.9) 100%),
    repeating-linear-gradient(108deg,
      rgba(255, 96, 96, 0.10) 0 15px, rgba(255, 196, 86, 0.10) 15px 30px,
      rgba(120, 230, 130, 0.09) 30px 45px, rgba(96, 196, 255, 0.11) 45px 60px,
      rgba(150, 120, 255, 0.10) 60px 75px, rgba(255, 110, 190, 0.09) 75px 90px),
    linear-gradient(180deg, #dde0e4, #b6bbc2 52%, #ccd0d5);
  background-size: 480px 100%, 100% 100%, 100% 100%, 100% 100%;
  background-position: -300px 0, 0 0, 0 0, 0 0;
  box-shadow:
    inset 0 0 0 0.5px rgba(70, 75, 85, 0.35),
    inset 0 1px 1px rgba(255, 255, 255, 0.6),
    inset 0 -1px 2px rgba(60, 65, 75, 0.25);
  animation: sweep 7.5s ease-out infinite;
}
@keyframes sweep { /* 大部分时间安静,偶尔一道光带路过——节拍来时就是它 */
  0%, 58%  { background-position: -300px 0, 0 0, 0 0, 0 0; }
  76%, 100% { background-position: 660px 0, 0 0, 0 0, 0 0; }
}
#holo .lyric {
  font-size: 14.5px; font-weight: 700; letter-spacing: 2.5px; color: #383c44;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55); /* 压凹的箔字 */
}
#holo .mark {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 6.5px; letter-spacing: 1.5px; color: rgba(56, 60, 68, 0.5);
  text-align: right; line-height: 1.5;
}

#tMeta {
  position: absolute; left: 18px; bottom: 12px; right: 16px;
  display: flex; justify-content: space-between;
  font-size: 9px; letter-spacing: 1.2px; color: rgba(44, 36, 24, 0.66);
}

/* 撕票口 + 副券 */
#tStub {
  position: relative; width: 118px;
  border-left: 1.5px dashed rgba(80, 64, 40, 0.38);
  padding: 13px 12px 11px;
}
#tStub::before, #tStub::after { /* 撕票口两端的冲孔 */
  content: ""; position: absolute; left: -5.5px; width: 9px; height: 9px; border-radius: 50%;
  background: #0b0806; box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.8);
}
#tStub::before { top: -4px; } #tStub::after { bottom: -4px; }
#stubTitle {
  position: absolute; right: 10px; top: 13px;
  writing-mode: vertical-rl; font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: rgba(44, 36, 24, 0.85);
}
#stubNo {
  position: absolute; left: 12px; top: 14px;
  writing-mode: vertical-rl; font-size: 6.5px; letter-spacing: 1.5px;
  color: rgba(44, 36, 24, 0.45);
}
#stubBar { /* 条码 */
  position: absolute; left: 12px; bottom: 11px; width: 92px; height: 22px;
  background: repeating-linear-gradient(90deg,
    rgba(40, 32, 20, 0.85) 0 1.5px, transparent 1.5px 4px,
    rgba(40, 32, 20, 0.85) 4px 6.5px, transparent 6.5px 8px,
    rgba(40, 32, 20, 0.85) 8px 9px, transparent 9px 12px);
}
.tagR { position: absolute; right: 10px; bottom: 36px; writing-mode: vertical-rl;
  font-size: 6.5px; letter-spacing: 2px; color: rgba(44, 36, 24, 0.4); }

/* ── 票根堆:今晚已经唱完的歌 ─────────────────────────────── */
#pileShadow {
  position: absolute; left: 0px; bottom: 54px; width: 240px; height: 16px;
  background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, 0.45), transparent 72%);
  filter: blur(4px);
}
.stub {
  position: absolute; width: 218px; height: 64px; border-radius: 4px;
  background:
    repeating-linear-gradient(0deg, rgba(120, 90, 50, 0.02) 0 1px, transparent 1px 3px),
    linear-gradient(174deg, #efe9da, #e4dbc6);
  box-shadow:
    inset 0 0 0 0.5px rgba(120, 90, 40, 0.2),
    0 2px 5px rgba(0, 0, 0, 0.32);
  padding: 9px 12px;
  color: rgba(44, 36, 24, 0.8);
}
.stub .st { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; }
.stub .sm { margin-top: 4px; font-size: 7px; letter-spacing: 1.2px; color: rgba(44, 36, 24, 0.5); }
.stub .edge { /* 左缘的撕痕:虚线撕开后的毛边 */
  position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: repeating-linear-gradient(0deg, rgba(120, 95, 60, 0.3) 0 3px, transparent 3px 6px);
}
#stub1 { left: 4px; bottom: 60px; transform: rotate(2.2deg) scaleY(0.96); }
#stub2 { left: 14px; bottom: 72px; transform: rotate(-1.6deg) scaleY(0.96); }
#stamp { /* 「散场」章:红印泥,盖章是每首歌的句号 */
  position: absolute; left: 14px; top: -14px; width: 46px; height: 46px;
  border: 1.5px solid rgba(196, 52, 38, 0.62); border-radius: 50%;
  transform: rotate(13deg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: rgba(196, 52, 38, 0.72); mix-blend-mode: multiply;
}
#stamp b { font-size: 11px; letter-spacing: 3px; font-weight: 700; }
#stamp i { font-style: normal; font-size: 5.5px; letter-spacing: 1px; margin-top: 1px; }

/* 灯锥里的浮尘 */
.dust { position: absolute; border-radius: 50%; background: rgba(255, 226, 188, 0.5); }
.d1 { left: 380px; bottom: 300px; width: 2px; height: 2px; opacity: 0.18; animation: drift 13s ease-in-out infinite alternate; }
.d2 { left: 520px; bottom: 390px; width: 1.5px; height: 1.5px; opacity: 0.13; animation: drift 17s ease-in-out infinite alternate -4s; }
.d3 { left: 660px; bottom: 330px; width: 2px; height: 2px; opacity: 0.10; animation: drift 11s ease-in-out infinite alternate -8s; }
.d4 { left: 300px; bottom: 240px; width: 1.5px; height: 1.5px; opacity: 0.14; animation: drift 15s ease-in-out infinite alternate -2s; }
@keyframes drift { to { transform: translate(9px, -16px); } }

#note {
  position: fixed; left: 18px; bottom: 14px;
  font-size: 11px; letter-spacing: 1px; color: rgba(200, 180, 150, 0.25);
}

@media (max-width: 1020px) {
  #set { transform: translateX(-50%) scale(0.8); transform-origin: bottom center; }
}
</style>
</head>
<body>

<div id="wall"></div>
<div id="desk"></div>

<div id="set">
  <!-- 浮尘 -->
  <i class="dust d1"></i><i class="dust d2"></i><i class="dust d3"></i><i class="dust d4"></i>

  <!-- 票根堆(已散场的歌) -->
  <div id="pileShadow"></div>
  <div class="stub" id="stub1">
    <i class="edge"></i>
    <div class="st">电流声里有你的名字</div>
    <div class="sm">23:41 散场 · 4:12</div>
  </div>
  <div class="stub" id="stub2">
    <i class="edge"></i>
    <div class="st">晚风信号塔</div>
    <div class="sm">23:36 散场 · 3:48</div>
    <div id="stamp"><b>散场</b><i>2026.06.11</i></div>
  </div>

  <!-- 立牌 -->
  <div id="baseShadow"></div>
  <div id="spill"></div>
  <div id="base"><i></i></div>
  <div id="acrylic">
    <div id="cover">
      <div class="t1">失眠都市</div>
      <div class="t2">SLEEPLESS CITY · LP</div>
    </div>
  </div>
  <div id="acrylicSpec"></div>

  <!-- 正在唱的这首歌的票 -->
  <div id="ticketShadow"></div>
  <div id="ticket">
    <div id="tMain">
      <div class="tag">ECHO PRESENTS · 2026 巡回 · 仅限一人</div>
      <div id="tTitle">失眠都市</div>
      <div id="tArtist">unknown artist · 检票 23:47</div>
      <div id="holo">
        <span class="lyric">整座城市替我失眠</span>
        <span class="mark">防伪<br>本场歌词</span>
      </div>
      <div id="tMeta">
        <span>内场 VIP · 排 01 · 座 01</span>
        <span>座位:耳机里 · ¥0.00</span>
      </div>
    </div>
    <div id="tStub">
      <div id="stubNo">NO. 20260611-003</div>
      <div id="stubTitle">失眠都市</div>
      <div class="tagR">副券 · 留存</div>
      <div id="stubBar"></div>
    </div>
  </div>
</div>

<div id="grain"></div>
<div id="note">票根 · 静态 taste check — 镭射条的光带按节拍扫过,立牌随低音轻晃(此页仅氛围采样)</div>

</body>
</html>
