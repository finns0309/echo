<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bg"></div>
    <canvas id="fx"></canvas>
    <div id="tint"></div>

    <div id="topbar">
      <div id="meta">
        <span id="title">—</span>
        <span id="artist"></span>
      </div>
      <div id="buttons">
        <button id="pin" title="鼠标穿透">◌</button>
        <button id="maximize" title="铺满屏幕 / 还原">⤢</button>
        <button id="close" title="退出">×</button>
      </div>
    </div>

    <div id="lyrics">
      <div class="line prev" id="prev"></div>
      <div class="line curr" id="curr">等待播放…</div>
      <div class="line next" id="next"></div>
    </div>

    <div id="stage"></div>

    <!-- Danmaku layer. Empty by default; FL_DANMAKU.spawn() appends one
         .dm-line per lyric change while data-layout="danmaku". Cards fly
         themselves out and self-remove on animationend. -->
    <div id="danmaku"></div>

    <!-- Conversation layer (imsg). JS lazily fills the header + stream +
         typing-dots scaffold on first activation. -->
    <div id="convo"></div>

    <!-- Furin layer (风铃). JS lazily builds the chime scaffold on first
         activation; physics + strike rings live in furin.js. -->
    <div id="furin"></div>

    <!-- Ticket layer (镭射票). JS lazily builds the holo ticket on first
         activation; tilt physics + foil light live in ticket.js. -->
    <div id="ticket"></div>

    <!-- Roam layer (漫游). Empty by default; FL_ROAM.spawn() stages one
         .rm-line per lyric change while data-layout="roam". Lines play their
         choreography and self-remove on animationend. -->
    <div id="roam"></div>

    <!-- Eva layer (新世纪). JS lazily builds the terminal scaffold on first
         activation; title cards + lock-on + A.T. field live in eva.js. -->
    <div id="eva"></div>

    <!-- Shinkai layer (云隙). Time-of-day sky; built lazily by shinkai.js. -->
    <div id="shinkai"></div>

    <!-- Idol layer (星瞳). Penlight-sea stage; built lazily by idol.js. -->
    <div id="idol"></div>

    <div id="toast"></div>

    <script src="themes.js"></script>
    <script src="fx.js"></script>
    <script src="lrc.js"></script>
    <script src="netease.js"></script>
    <script src="danmaku.js"></script>
    <script src="conversation.js"></script>
    <script src="audio.js"></script>
    <script src="textpick.js"></script>
    <!-- furin.js / ticket.js / roam.js register onset handlers with FL_AUDIO
         at load — keep them after audio.js and before app.js (which drives
         their per-frame hooks). -->
    <script src="furin.js"></script>
    <script src="ticket.js"></script>
    <script src="roam.js"></script>
    <script src="eva.js"></script>
    <script src="shinkai.js"></script>
    <script src="idol.js"></script>
    <script src="app.js"></script>
  </body>
</html>
