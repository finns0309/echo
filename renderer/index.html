<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bg"></div>
    <canvas id="fx"></canvas>
    <div id="tint"></div>

    <div id="topbar">
      <div id="meta">
        <span id="title">—</span>
        <span id="artist"></span>
      </div>
      <div id="buttons">
        <button id="pin" title="鼠标穿透">◌</button>
        <button id="maximize" title="铺满屏幕 / 还原">⤢</button>
        <button id="close" title="退出">×</button>
      </div>
    </div>

    <div id="lyrics">
      <div class="line prev" id="prev"></div>
      <div class="line curr" id="curr">等待播放…</div>
      <div class="line next" id="next"></div>
    </div>

    <div id="stage"></div>

    <!-- Danmaku layer. Empty by default; FL_DANMAKU.spawn() appends one
         .dm-line per lyric change while data-layout="danmaku". Cards fly
         themselves out and self-remove on animationend. -->
    <div id="danmaku"></div>

    <!-- Conversation layer (imsg). JS lazily fills the header + stream +
         typing-dots scaffold on first activation. -->
    <div id="convo"></div>

    <div id="toast"></div>

    <script src="themes.js"></script>
    <script src="fx.js"></script>
    <script src="lrc.js"></script>
    <script src="netease.js"></script>
    <script src="danmaku.js"></script>
    <script src="conversation.js"></script>
    <script src="audio.js"></script>
    <script src="app.js"></script>
  </body>
</html>
